name: Deploy Repo Museum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Curate the built-in Agent collection
        run: python3 skills/repo-museum/scripts/build_museum.py

      - name: Verify checked-in Agent collection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fresh = json.loads(Path('.repo-museum/museum.json').read_text())
          checked_in = json.loads(Path('collections/repo-museum.json').read_text())
          fresh_graph = fresh.get('repositoryMap', {}).get('signalGraph')
          checked_in_graph = checked_in.get('repositoryMap', {}).get('signalGraph')
          if fresh_graph != checked_in_graph:
              raise SystemExit(
                  'collections/repo-museum.json has a stale signal graph; '
                  'run build_museum.py and copy .repo-museum/museum.json.'
              )
          PY

      - name: Stage the static site
        run: |
          mkdir -p _site/collections
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='.repo-museum' ./ _site/
          cp .repo-museum/museum.json _site/collections/repo-museum.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
