name: Deploy Repo Museum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Curate the built-in Agent collection
        run: python3 skills/repo-museum/scripts/build_museum.py

      - name: Stage the static site
        run: |
          mkdir -p _site/collections
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='.repo-museum' ./ _site/
          cp .repo-museum/museum.json _site/collections/repo-museum.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
